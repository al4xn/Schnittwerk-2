# render.yaml
# Render Blueprint: kostenloser Server, Daten liegen in einer kostenlosen Upstash-Datenbank
services:
  - type: web
    name: schnittwerk
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /api/ping
    envVars:
      - key: OWNER_NAME
        value: Alan              # dein Spielername -> bekommt die ID #1
      - key: UPSTASH_REDIS_REST_URL
        value: https://pretty-prawn-288825.upstash.io   # aus dem Upstash-Dashboard (REST API)
      - key: UPSTASH_REDIS_REST_TOKEN
        value: gQAAAAABgG5AAIgcD14NWYwDdMmMiWNDY0OGVmYjg1N2I2NzVjMjFjZjJjRiMw